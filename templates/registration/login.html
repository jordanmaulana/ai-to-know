{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign in — AI to know</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'output.css' %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" />
  </head>
  <body class="min-h-screen bg-paper text-ink antialiased">
    <div class="flex min-h-screen items-center justify-center px-4">
      <div class="w-full max-w-sm">
        <div class="font-mono text-xs tracking-[0.2em] text-muted uppercase">ai&#8202;/&#8202;to&#8202;know</div>
        <div class="mt-4 rounded-xl border border-rule bg-card p-6">
          <h1 class="text-xl font-semibold tracking-tight">Sign in</h1>
          <p class="mt-1 text-sm text-muted">Editors only. Readers do not need an account.</p>

          {% if form.non_field_errors %}
            <div class="mt-4 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800">
              {{ form.non_field_errors }}
            </div>
          {% endif %}

          <form method="post" class="mt-6 flex flex-col gap-4">
            {% csrf_token %}
            <label class="flex flex-col gap-1.5 text-sm">
              <span class="font-medium">Username</span>
              <input name="username" type="text" autocomplete="username" required autofocus
                     class="rounded-md border border-rule bg-paper px-3 py-2 text-sm text-ink focus:border-accent focus:ring-2 focus:ring-accent/20 focus:outline-none" />
            </label>
            <label class="flex flex-col gap-1.5 text-sm">
              <span class="font-medium">Password</span>
              <input name="password" type="password" autocomplete="current-password" required
                     class="rounded-md border border-rule bg-paper px-3 py-2 text-sm text-ink focus:border-accent focus:ring-2 focus:ring-accent/20 focus:outline-none" />
            </label>
            <button type="submit"
                    class="rounded-md bg-ink px-3 py-2.5 font-mono text-[0.6875rem] tracking-widest text-paper uppercase transition hover:opacity-85">
              Log in
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
