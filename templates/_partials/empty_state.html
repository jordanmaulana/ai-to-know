{# Usage: {% include "_partials/empty_state.html" with message="Nothing matches that." action_url=url action_label="Clear filters" %} #}
<div class="rounded-xl border border-dashed border-rule bg-card/60 px-6 py-12 text-center">
  <p class="text-sm text-muted">{{ message }}</p>
  {% if action_url %}
    <a href="{{ action_url }}" class="mt-3 inline-block text-sm text-accent underline underline-offset-4">{{ action_label }}</a>
  {% endif %}
</div>
