{# One form field. Usage: {% include "_partials/field.html" with field=form.title %}
   Widget classes come from SubjectForm.Meta.widgets, so nothing is injected here. #}
<label class="flex flex-col gap-1.5">
  <span class="text-sm font-medium text-ink">
    {{ field.label }}{% if field.field.required %}<span class="text-red-600" aria-hidden> *</span>{% endif %}
  </span>
  {{ field }}
  {% if field.help_text %}<span class="text-xs text-muted">{{ field.help_text }}</span>{% endif %}
  {% for error in field.errors %}<span class="text-xs text-red-700">{{ error }}</span>{% endfor %}
</label>
