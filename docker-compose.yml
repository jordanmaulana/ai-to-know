services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env.docker
    environment:
      ROLE: web
      POSTGRES_HOST: postgres
    ports:
      # Host 8012 (8000 is taken by another stack); container side stays 8000 —
      # the healthcheck below and gunicorn's --bind both target the internal port.
      - "8012:8000"
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/login/"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M

  # Daily HN crawl. Same image as `backend`, ROLE=cron so the entrypoint skips
  # migrate/collectstatic (no race with the web container) but still waits for postgres.
  cron:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env.docker
    environment:
      ROLE: cron
      POSTGRES_HOST: postgres
      # Drives the crontab's wall clock; must match settings.TIME_ZONE.
      TZ: ${TZ:-Asia/Jakarta}
    # Overrides the image CMD (gunicorn); the ENTRYPOINT still runs.
    command: ["supercronic", "/app/docker/crontab"]
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    # No healthcheck: supercronic serves nothing. Liveness is `docker compose logs cron`.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  frontend:
    build:
      context: ./frontend
      # VITE_* are baked into the bundle at build time — changing one needs a rebuild,
      # not a restart. Values come from the --env-file the Makefile passes.
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    ports:
      # Host 3012 (3000/3001/3003/3005/3007/3010 are taken); nginx listens on 3000 inside.
      - "3012:3000"
    depends_on:
      backend: {condition: service_started}
    healthcheck:
      # nginx:alpine ships busybox wget, not curl.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  pgdata:
