server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite asset filenames are content-hashed, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy keeps serving the old asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # TanStack Router owns /subjects/<slug>, /login, /dashboard client-side: a hard refresh
    # on one of those has to return index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
